# Release workflow — build cross-platform binaries and publish a GitHub release
#
# Triggered by pushing a version tag (e.g., `git tag v0.2.0 && git push --tags`).
# Creates a GitHub Release with pre-built binaries for Linux, macOS, and Windows
# (five standard archives + checksums.txt + provenance.json).
#
# Modeled on the authoritative toolshed standard: see
# dulce-de-leche/.github/workflows/release.yml. Differences from that file
# (both intentional, wild-bsp):
#   * binary name is `wild`; the crates.io package is `wild-vibes`
#     (the `wild` crate name on crates.io belongs to an unrelated crate).
#   * no homebrew/scoop channel steps: the homebrew-charly tap has no wild
#     formula and scoop-charly has no wild manifest yet; creating the first
#     one is a separate distribution decision (tracked, wild-bsp follow-up).
#
# Security model (SEC-06 / DDL-bas):
#   * Workflow-level permissions default to `contents: read`; only the `publish`
#     job is granted `contents: write`, so no build/test job can touch releases.
#   * Publication credentials (CARGO_REGISTRY_TOKEN, GITHUB_TOKEN) are
#     referenced exclusively inside the `publish` job.
#   * `publish` needs `test` in addition to the build jobs: a failed, skipped,
#     or cancelled test run on the tagged commit prevents publication entirely.
#   * Every third-party action is pinned to a full reviewed commit SHA.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux

      - name: Install aarch64 cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build x86_64 Linux
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Build aarch64 Linux
        run: cargo build --release --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Stage binaries
        run: |
          mkdir -p bins/linux_amd64 bins/linux_arm64
          cp target/x86_64-unknown-linux-gnu/release/wild bins/linux_amd64/wild
          cp target/aarch64-unknown-linux-gnu/release/wild bins/linux_arm64/wild

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bins-linux
          path: bins/
          retention-days: 1

  build-darwin:
    name: Build macOS
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: darwin

      - name: Build x86_64 macOS
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build aarch64 macOS
        run: cargo build --release --target aarch64-apple-darwin

      - name: Stage binaries
        run: |
          mkdir -p bins/darwin_amd64 bins/darwin_arm64
          cp target/x86_64-apple-darwin/release/wild bins/darwin_amd64/wild
          cp target/aarch64-apple-darwin/release/wild bins/darwin_arm64/wild

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bins-darwin
          path: bins/
          retention-days: 1

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows

      - name: Build x86_64 Windows
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p bins/windows_amd64
          cp target/x86_64-pc-windows-msvc/release/wild.exe bins/windows_amd64/wild.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bins-windows
          path: bins/
          retention-days: 1

  # Test gate runs on the exact tagged commit (GITHUB_SHA) before anything is
  # published. A failed / skipped / cancelled run blocks `publish` via its
  # `needs` list.
  test:
    name: Test tagged commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test

      - name: Run full test suite
        run: cargo test --locked

  publish:
    name: Publish Release
    needs: [build-linux, build-darwin, build-windows, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: bins-*
          path: bins/
          merge-multiple: true

      - name: Package archives and checksums
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          # upload-artifact v4 does not preserve file permissions — restore the
          # exec bit or the tarballs ship 644 binaries and `curl | tar xz` installs
          # a non-runnable wild (see DDL-3av).
          chmod +x -- bins/*/*
          tar -czf "dist/wild_${VERSION}_linux_amd64.tar.gz"  -C bins/linux_amd64  wild
          tar -czf "dist/wild_${VERSION}_linux_arm64.tar.gz"  -C bins/linux_arm64  wild
          tar -czf "dist/wild_${VERSION}_darwin_amd64.tar.gz" -C bins/darwin_amd64 wild
          tar -czf "dist/wild_${VERSION}_darwin_arm64.tar.gz" -C bins/darwin_arm64 wild
          (cd bins/windows_amd64 && zip "../../dist/wild_${VERSION}_windows_amd64.zip" wild.exe)
          cd dist && sha256sum ./*.tar.gz ./*.zip > checksums.txt

      # Rung-2 fleet rollout (beads wild-zjv, openspec
      # add-wild-contract-bundle-convention task 3.2): extract the contract
      # bundle from the exact release checkout (this job's checkout, the same
      # tree the published binaries were built from) and attach it to the
      # release below. The pinned extractor version is part of the bundle's
      # trust chain (manifest.extractor_version) — never `latest`. The step
      # runs before the provenance manifest so the bundle digest is bound
      # into provenance.json too.
      - name: Install wild extractor
        run: cargo install wild-vibes --version 0.2.1 --locked

      - name: Extract contract bundle
        run: bash scripts/make-contract-bundle.sh "${{ steps.pkg.outputs.version }}" dist

      # DDL-wof (SEC-03/06): publish cryptographically verifiable provenance for
      # every supported binary. provenance.json binds each published artifact's
      # sha256 to the publisher/build identity (repository, workflow, tag) that
      # produced the release. provenance.json is excluded from its own artifact
      # map because a file cannot contain its own digest.
      - name: Generate provenance manifest
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import hashlib, json, os
          dist = "dist"
          artifacts = {}
          for name in sorted(os.listdir(dist)):
              if name == "provenance.json":
                  continue
              path = os.path.join(dist, name)
              if not os.path.isfile(path):
                  continue
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              artifacts[name] = h.hexdigest()
          provenance = {
              "repository": os.environ["REPO"],
              "workflow": "Release",
              "tag": os.environ["TAG"],
              "artifacts": artifacts,
          }
          with open(os.path.join(dist, "provenance.json"), "w") as f:
              json.dump(provenance, f, indent=2, sort_keys=True)
              f.write("\n")
          EOF

      - name: Create GitHub release
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.pkg.outputs.version }}"
          PRERELEASE=""
          [[ "${TAG}" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            $PRERELEASE \
            dist/wild_${VERSION}_linux_amd64.tar.gz \
            dist/wild_${VERSION}_linux_arm64.tar.gz \
            dist/wild_${VERSION}_darwin_amd64.tar.gz \
            dist/wild_${VERSION}_darwin_arm64.tar.gz \
            dist/wild_${VERSION}_windows_amd64.zip \
            dist/wild_${VERSION}-contract-bundle.tar.gz \
            dist/checksums.txt \
            dist/provenance.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish the wild-vibes package to crates.io. A missing
      # CARGO_REGISTRY_TOKEN means the channel is intentionally disabled and is
      # reported as such — never a release failure (DDL-9e7 channel pattern;
      # tap/scoop channels are not wired yet, see the header comment).
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::notice::crates.io publish is disabled (CARGO_REGISTRY_TOKEN not set)."
            exit 0
          fi
          cargo publish --allow-dirty
