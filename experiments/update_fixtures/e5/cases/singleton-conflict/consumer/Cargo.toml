#   real Cargo range enforcement; `~1.2` is rewritten by the test harness
#   only to pin exact baseline/target versions.
[package]
name = "consumer"
version = "0.1.0"
edition = "2021"

[dependencies]
dept = "~1.2"
deputil = "=2.0.0"
