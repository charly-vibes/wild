# Purpose: Host manifest for the wild extractor crate (beads wild-mh5.1).
# Responsibilities: Declare the repo-root Rust CLI/library that implements
#   the rust-cargo-local-1 extraction profile: strict v1 JSON handling,
#   syn-based inventory, and the `wild` binary entrypoint.
# Rationale (package name): the `wild` crate name on crates.io belongs to an
#   unrelated glob-expansion crate (kornelski/wild), so publication is deferred
#   under `wild-vibes` (verified available); the repository, binary, and
#   wire-format extractor identity remain `wild` (beads wild-6ig).
# Rationale: The slice requires a pinned parser inventoring Rust source
#   without executing it. syn is pinned to vampiro-rust-frontend's exact
#   parser version (2.0.119) with the feature set settled in the
#   wild-mh5.1 design review; remaining deps are resolved and pinned in
#   the committed Cargo.lock, required by this slice only.
#   libc is required and pinned by wild-mh5.4: the law-suite sandbox applies
#   Landlock restriction, no-new-privs, and resource limits inside the
#   pre-exec hook with raw syscalls (async-signal-safe, no new high-level
#   sandbox dependency), which needs the C ABI surface.

[package]
name = "wild-vibes"
version = "0.2.0"
edition = "2021"
description = "Scoped dependency-contract checker for Rust/Cargo updates: extracts crate inventories (rust-cargo-local-1), validates v1 contract documents, and evaluates consumer update plans."
license = "Apache-2.0"
repository = "https://github.com/charly-vibes/wild"
# Publish hygiene: the crate ships source, schemas, docs source, and the
# runtime conformance tests. The repo-root test_*.py suite and the workflow
# files below are repo infrastructure (they depend on openspec/, experiments/,
# .espectacular/), not crate content. exclude is used instead of include
# because cargo's include is additive over the git-tracked default set, and
# exclude is ignored when include is present (cargo 1.98). exclude also
# overrides cargo's auto-inclusion of every README/LICENSE found in the tree
# (which otherwise drags in .devenv venv licenses, .beads, .pytest_cache).
exclude = [
  ".github/**",
  ".espectacular/**",
  ".wai/**",
  ".beads/**",
  ".devenv/**",
  ".pytest_cache/**",
  "cv/**",
  "experiments/**",
  "openspec/**",
  "results/**",
  "superseded/**",
  "prototype/**",
  "theme/**",
  "docs/book/**",
  "**/__pycache__/**",
  "target/**",
  "AGENTS.md",
  "CLAUDE.md",
  "book.toml",
  "devenv.nix",
  "devenv.yaml",
  "justfile",
  "lefthook.yml",
  "llms.txt",
  "pretender.toml",
  "requirements-dev.txt",
  "testaruda.toml",
  "versions.ddl.toml",
  "tests/*.py",
]

[lib]
# Internal crate name stays `wild` so module imports (`use wild::...`)
# and the wire-format identity are untouched by the publish rename.
name = "wild"

# The repository and command are `wild`; only the publishable package name
# carries the -vibes suffix (crates.io collision, see header rationale).
[[bin]]
name = "wild"
path = "src/main.rs"

[dependencies]
syn = { version = "=2.0.119", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
toml = "0.9"
sha2 = "0.10"
libc = "0.2"
